[project]
name = "pmsa"
version = "0.1.0"
description = "Frozen-feature AI-image detection with auditable threshold calibration"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "pillow>=10.0",
]

[project.optional-dependencies]
extract = ["torch>=2.6", "torchvision>=0.21", "transformers>=4.40"]
dev = ["pytest>=7.4"]
app = ["torch>=2.6", "torchvision>=0.21", "transformers>=4.40", "gradio>=6.18,<7", "pillow-heif>=0.16"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pmsa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
